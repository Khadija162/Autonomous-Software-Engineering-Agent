services:
  api:
    build: .
    environment:
      AGENT_REPO_ROOT: /app/sample_repo
      LLM_MODE: mock
    ports: ["127.0.0.1:8000:8000"]
  ui:
    build: .
    command: ["streamlit","run","frontend/app.py","--server.address","0.0.0.0","--server.port","8501"]
    ports: ["127.0.0.1:8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on: [api]
